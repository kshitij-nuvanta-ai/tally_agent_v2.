[project]
name = "tallyprime-agent"
version = "0.1.0"
description = "AI-powered chatbot for TallyPrime accounting data"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.84.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.3",
    "uvicorn>=0.34",
    # Was the `db` extra until the v2 merge (spec M13): the sync code needs the database stack unconditionally.
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.30",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=4.0,<5.0",
    "PyJWT>=2.8",
]

[project.optional-dependencies]
langfuse = [
    "langfuse>=2.0",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
    "opentelemetry-instrumentation-anthropic>=0.61.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "aiohttp>=3.9",
    "pytest-aiohttp>=1.0",
    "playwright",
    "pyyaml",
    "jinja2",
]
# Kept empty so existing `uv sync --extra db` commands keep working; its packages are core dependencies now.
db = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
